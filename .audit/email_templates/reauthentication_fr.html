<!-- Supabase "Reauthentication" (code OTP). Sujet : Votre code de vérification MineGrid
     Variable : {{ .Token }} (code a 6 chiffres, PAS d'URL ici) -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 560px; margin: 0 auto; background:#f6f7f9; padding: 8px;">
  <div style="text-align:center; padding: 28px 0 20px;">
    <img src="https://minegrid-equipement.com/logo%20Minegrid%20equipement%20trans.png" alt="MineGrid Équipement" width="160" style="width:160px; height:auto; display:inline-block;">
  </div>
  <div style="background:#ffffff; border:1px solid #eeeeee; border-radius:14px; padding:36px 32px; color:#1f2937; text-align:center;">
    <h1 style="font-size:21px; margin:0 0 14px; color:#111827;">Votre code de vérification</h1>
    <p style="font-size:15px; line-height:1.6; color:#374151; margin:0 0 20px;">
      Utilisez ce code pour confirmer votre action sur <strong>MineGrid Équipement</strong> :
    </p>
    <div style="font-size:34px; font-weight:800; letter-spacing:8px; color:#ea580c; background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:16px 0; margin:0 auto 20px; max-width:300px;">
      {{ .Token }}
    </div>
    <p style="font-size:13px; color:#9ca3af; margin-top:8px;">Ce code expire rapidement. Vous n'êtes pas à l'origine de cette demande ? Ignorez cet e-mail.</p>
  </div>
  <p style="text-align:center; font-size:12px; color:#9ca3af; padding:18px 0;">© MineGrid Équipement — Équipements de construction et de mine en Afrique</p>
</div>
