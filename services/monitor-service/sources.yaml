  - name: "MDB Procurement - WB/AfDB/IsDB"
    connector: mdb_procurement
    enabled: true
    config:
      timeout_seconds: 25
      max_items_per_source: 300
      country_filter: ["MA", "DZ", "TN", "LY", "MR", "EG", "SA", "AE", "QA", "KW", "OM", "BH", "JO", "LB", "IQ", "FR", "DE", "ES", "IT", "GB", "PT", "NL", "BE", "CH", "AT", "GR", "PL", "RO", "SN", "CI", "CM", "NG", "GH", "BF", "GN", "NE", "ML", "BJ", "TG"]
      sources:
        - name: "World Bank Procurement Notices"
          source_code: "WB"
          format: "html"
          url: "https://projects.worldbank.org/en/projects-operations/opportunities"
          include_patterns: ["procurement", "notice", "bid", "opportunit", "tender", "construction", "civil works", "building", "works", "btp"]
          type_hint: "infrastructure"
          default_phase: "tender"
        - name: "AfDB Procurement Notices"
          source_code: "AFDB"
          format: "html"
          url: "https://www.afdb.org/en/projects-and-operations/procurement"
          include_patterns: ["procurement", "notice", "tender", "bid", "opportunit", "construction", "civil works", "building", "works", "btp"]
          type_hint: "infrastructure"
          headers:
            Accept: "text/html,application/xhtml+xml"
          default_phase: "tender"
        - name: "IsDB Procurement Notices"
          source_code: "ISDB"
          format: "html"
          url: "https://www.isdb.org/project-procurement/fr/appels-doffres"
          include_patterns: ["appel", "offres", "procurement", "tender", "bid", "btp", "batiment", "bâtiment", "construction", "travaux publics", "génie civil", "civil works"]
          type_hint: "infrastructure"
          default_phase: "tender"
        - name: "World Bank Energy Opportunities"
          source_code: "WB"
          format: "html"
          url: "https://projects.worldbank.org/en/projects-operations/opportunities"
          include_patterns: ["energy", "power", "electric", "solar", "wind", "hydro", "grid", "substation"]
          type_hint: "energy"
          default_phase: "tender"
        - name: "AfDB Energy Opportunities"
          source_code: "AFDB"
          format: "html"
          url: "https://www.afdb.org/en/projects-and-operations/procurement"
          include_patterns: ["energy", "power", "electric", "solar", "wind", "hydro", "grid", "substation"]
          type_hint: "energy"
          default_phase: "tender"
        - name: "IsDB Energy Opportunities"
          source_code: "ISDB"
          format: "html"
          url: "https://www.isdb.org/project-procurement/fr/appels-doffres"
          include_patterns: ["énergie", "energy", "power", "electric", "solar", "wind", "hydro", "grid"]
          type_hint: "energy"
          default_phase: "tender"
        - name: "World Bank Mining Opportunities"
          source_code: "WB"
          format: "html"
