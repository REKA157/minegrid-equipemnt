# Configuration des sources d'ingestion — Minegrid Global Monitor
# Chaque entrée est un connecteur avec sa config spécifique.

sources:

  # SOURCE PRINCIPALE — structuree, multi-pays : avis d'AO ET attributions (laureats).
  # API publique World Bank Procurement Notices (~tous les pays membres).
  - name: "World Bank Procurement - tous pays"
    connector: wb_procurement
    enabled: true
    config:
      max_items: 2500          # plus large car on filtre ensuite sur les marches cibles
      page_rows: 200
      exclude_groups: ["CS"]   # exclut Consulting Services ; garde CW (travaux), GO (biens), NC
      restrict_to_target_markets: true   # Afrique + Maghreb + Moyen-Orient + Europe (target_markets.py)

  # === Flux OCDS (tenders + ATTRIBUTIONS/gagnants, structures) — connecteur ocds_feed ===
  # Afrique (bulk JSONL via registre Open Contracting + 1 API live)
  - name: "OCDS - Ghana (PPA)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "Ghana PPA", mode: "bulk_jsonl_gz", country_default: "Ghana", max_items: 1500, feed_url: "https://data.open-contracting.org/en/publication/85/download", params: { name: "full.jsonl.gz" } }
  - name: "OCDS - Nigeria (BPP)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "Nigeria BPP", mode: "bulk_jsonl_gz", country_default: "Nigeria", max_items: 1500, feed_url: "https://data.open-contracting.org/en/publication/64/download", params: { name: "full.jsonl.gz" } }
  - name: "OCDS - Kenya (PPRA)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "Kenya PPRA", mode: "bulk_jsonl_gz", country_default: "Kenya", max_items: 1500, feed_url: "https://data.open-contracting.org/en/publication/147/download", params: { name: "full.jsonl.gz" } }
  - name: "OCDS - Tanzanie (PPRA NeST)"
    connector: ocds_feed
    enabled: true   # fichier annuel 2026 (31 Mo) ; titre derive des items, pas de mainProcurementCategory
    config: { source_name: "Tanzania PPRA", mode: "bulk_jsonl_gz", country_default: "Tanzania", max_items: 2000, feed_url: "https://data.open-contracting.org/en/publication/152/download", params: { name: "2026.jsonl.gz" } }
  - name: "OCDS - Ouganda (PPDA)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "Uganda PPDA", mode: "bulk_jsonl_gz", country_default: "Uganda", max_items: 1500, feed_url: "https://data.open-contracting.org/en/publication/130/download", params: { name: "full.jsonl.gz" } }
  - name: "OCDS - Rwanda (RPPA)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "Rwanda RPPA", mode: "bulk_jsonl_gz", country_default: "Rwanda", max_items: 1500, feed_url: "https://data.open-contracting.org/en/publication/145/download", params: { name: "full.jsonl.gz" } }
  - name: "OCDS - Zambie (ZPPA)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "Zambia ZPPA", mode: "bulk_jsonl_gz", country_default: "Zambia", max_items: 1500, feed_url: "https://data.open-contracting.org/en/publication/3/download", params: { name: "full.jsonl.gz" } }
  - name: "OCDS - Afrique du Sud (eTenders, API live)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "South Africa eTenders", mode: "api", country_default: "South Africa", max_items: 600, max_pages: 25, feed_url: "https://ocds-api.etenders.gov.za/api/OCDSReleases", params: { PageSize: 50, dateFrom: "2025-06-01", dateTo: "2026-12-31" } }
  # Europe (API live + bulk)
  - name: "OCDS - Royaume-Uni (Find a Tender, API live)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "UK Find a Tender", mode: "api", country_default: "United Kingdom", max_items: 600, max_pages: 25, feed_url: "https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages", params: { stages: "award" } }
  - name: "OCDS - France (DECP)"
    connector: ocds_feed
    enabled: true   # full 67 Mo en latin-1 (repli decode) ; pas de mainProcurementCategory -> mots-cles
    config: { source_name: "France DECP", mode: "bulk_jsonl_gz", country_default: "France", max_items: 2000, feed_url: "https://data.open-contracting.org/en/publication/23/download", params: { name: "full.jsonl.gz" } }
  - name: "OCDS - Italie (ANAC)"
    connector: ocds_feed
    enabled: true   # fichier annuel 2025 (3,5 Mo) ; mainProcurementCategory present (works/services)
    config: { source_name: "Italy ANAC", mode: "bulk_jsonl_gz", country_default: "Italy", max_items: 2000, feed_url: "https://data.open-contracting.org/en/publication/117/download", params: { name: "2025.jsonl.gz" } }
  - name: "OCDS - Pays-Bas (TenderNed)"
    connector: ocds_feed
    enabled: true
    config: { source_name: "Netherlands TenderNed", mode: "bulk_jsonl_gz", country_default: "Netherlands", max_items: 1500, feed_url: "https://data.open-contracting.org/en/publication/71/download", params: { name: "full.jsonl.gz" } }

  - name: "World Bank Data360 - Afrique"
    connector: wb_data360
    enabled: true
    config:
      dataset_ids:
        - "africa-infrastructure-development-index"
        - "programme-for-infrastructure-development-in-africa"
      country_filter: ["SN", "CI", "GH", "CM", "BF", "GN", "NE", "ML", "MA", "NG", "DZ", "TN", "LY", "MR", "EG", "BJ", "TG", "SA", "AE", "QA", "KW", "OM", "BH", "JO", "LB", "IQ", "FR", "DE", "ES", "IT", "GB", "PT", "NL", "BE", "CH", "AT", "GR", "PL", "RO"]

  - name: "PPI Database - Afrique"
    connector: ppi
    enabled: false   # ppi_projects.csv absent -> aucune donnee ; desactive (100% live)
    config:
      file_path: "data/ppi_projects.csv"
      delimiter: ","
      encoding: "utf-8"
      country_filter: ["Senegal", "Ghana", "Cameroon", "Nigeria", "Morocco", "Algeria", "Tunisia", "Libya", "Mauritania", "Egypt", "Saudi Arabia", "United Arab Emirates", "Qatar", "Kuwait", "Oman", "Bahrain", "Jordan", "Lebanon", "Iraq", "France", "Germany", "Spain", "Italy", "United Kingdom", "Portugal", "Netherlands", "Belgium", "Switzerland", "Austria", "Greece", "Poland", "Romania", "Benin", "Togo"]

  - name: "Mining Seed Africa - multi pays"
    connector: ppi
    enabled: false   # SEED fabrique (URLs example.org, montants ronds) -> desactive (anti-facade)
    config:
      file_path: "data/mining_projects_seed.csv"
      delimiter: ","
      encoding: "utf-8"
      country_filter: ["Morocco", "Algeria", "Mauritania", "Egypt", "Tunisia", "Libya", "Guinea", "Senegal", "Côte d'Ivoire", "Nigeria", "Ghana", "Burkina Faso", "Mali", "Niger", "Benin", "Togo", "Cameroon"]

  - name: "OCDS - Marchés Publics Sénégal"
    connector: ocds_feed
    enabled: false
    config:
      feed_url: "https://example.com/ocds/releases.json"
      max_pages: 3
      country_default: "Senegal"

  - name: "Portails publics - Afrique Ouest + Cible"
    connector: public_portals
    enabled: true
    config:
      timeout_seconds: 25
      max_items_per_source: 300
      default_phase: "tender"
      country_filter: ["MA", "DZ", "TN", "LY", "MR", "EG", "SA", "AE", "QA", "KW", "OM", "BH", "JO", "LB", "IQ", "FR", "DE", "ES", "IT", "GB", "PT", "NL", "BE", "CH", "AT", "GR", "PL", "RO", "SN", "CI", "CM", "NG", "GH", "BF", "GN", "NE", "ML", "BJ", "TG"]
