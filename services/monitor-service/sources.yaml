          country: "Morocco"
          country_code: "MA"
          format: "html"
          url: "https://www.marchespublics.gov.ma/pmmp"
          phase: "tender"
          type_hint: "btp"
          include_patterns: ["appel d'offres", "appel d’offres", "marché", "marche", "consultation", "avis", "btp", "batiment", "bâtiment", "construction", "travaux publics", "génie civil"]
          crawl_pages: 10
        - name: "Morocco Public Procurement Home"
          country: "Morocco"
          country_code: "MA"
          format: "html"
          url: "https://www.marchespublics.gov.ma/index.php?page=entreprise.EntrepriseHome"
          phase: "tender"
          type_hint: "btp"
          include_patterns: ["appel d'offres", "appel d’offres", "marché", "marche", "consultation", "avis", "btp", "batiment", "bâtiment", "construction", "travaux publics", "génie civil"]
