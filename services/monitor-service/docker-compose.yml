services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor_db
    ports:
      # Ports configurables (.env) : sur un poste de dev, 5432/8000 sont
      # souvent déjà pris par un autre projet — évite « port is already allocated ».
      - "${MONITOR_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  monitor-api:
    build: .
    ports:
      - "${MONITOR_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor:monitor@postgres:5432/monitor_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./sources.yaml:/app/sources.yaml:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

volumes:
  pgdata:
