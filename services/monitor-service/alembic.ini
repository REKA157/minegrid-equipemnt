[alembic]
script_location = alembic
# Constate le 2026-10-02 en deployant sur le VPS : `alembic upgrade head`
# echouait sur « ModuleNotFoundError: No module named 'app' ». La commande
# `alembic` est un script console : Python met dans sys.path le dossier du
# script (/usr/local/bin), PAS le dossier courant. alembic/env.py fait
# `from app.database import Base`, qui devenait donc introuvable alors que le
# code est bien la, dans /app. Cette ligne remet le dossier courant dans le
# chemin de recherche, comme le fait `python -m`.
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://monitor:monitor@localhost:5432/monitor_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
