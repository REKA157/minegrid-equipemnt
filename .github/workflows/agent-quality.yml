name: Agent Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project files
        run: |
          echo "Repository checked out."
          ls -la

      - name: Node.js checks if package.json exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Run lint if available
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present

      - name: Run tests if available
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Run build if available
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: Python tests if pytest config exists
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest || true

      - name: Check agent report sections
        run: |
          python scripts/validate_agent_output.py || true
